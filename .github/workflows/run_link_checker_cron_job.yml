name: Run Link Checker for Cron Job
on:
  push:
    branches:
    - main
  schedule:
  # Run everyday at 3:00 AM (See https://pubs.opengroup.org/onlinepubs/9699919799/utilities/crontab.html#tag_20_25_07)
  - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1.1.3
      with:
        config-file: 'mlc_config.json'
        use-quiet-mode: 'no'
        use-verbose-mode: 'yes'